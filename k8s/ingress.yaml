apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cost-optimizer
  namespace: cost-optimizer
  labels:
    app.kubernetes.io/name: cost-optimizer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cost-optimizer.example.com
      secretName: cost-optimizer-tls
  rules:
    - host: cost-optimizer.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cost-optimizer-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cost-optimizer-frontend
                port:
                  number: 80
