apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cost-optimizer-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: cost-optimizer
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cost-optimizer
  source:
    repoURL: https://github.com/your-org/cloud-cost-optimizer.git
    targetRevision: main
    path: helm/cost-optimizer
    helm:
      valueFiles:
        - ../../argocd/overlays/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cost-optimizer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
