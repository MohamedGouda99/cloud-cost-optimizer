apiVersion: v1
kind: Service
metadata:
  name: {{ include "cost-optimizer.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cost-optimizer.frontendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cost-optimizer.frontendSelectorLabels" . | nindent 4 }}
