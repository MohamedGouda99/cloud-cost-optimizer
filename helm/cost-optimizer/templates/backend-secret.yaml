{{- if not .Values.backend.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cost-optimizer.fullname" . }}-backend-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cost-optimizer.backendLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
