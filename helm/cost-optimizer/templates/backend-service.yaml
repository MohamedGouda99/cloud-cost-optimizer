apiVersion: v1
kind: Service
metadata:
  name: {{ include "cost-optimizer.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cost-optimizer.backendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cost-optimizer.backendSelectorLabels" . | nindent 4 }}
