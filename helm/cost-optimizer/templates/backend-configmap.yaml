apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cost-optimizer.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cost-optimizer.backendLabels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
