# Global settings
global:
  imageRegistry: "ghcr.io/your-org"

nameOverride: ""
fullnameOverride: ""

# Backend configuration
backend:
  replicaCount: 2

  image:
    repository: ghcr.io/your-org/cost-optimizer-backend
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  config:
    OPENAI_MODEL: "gpt-4"
    GCP_PROJECT_ID: "your-gcp-project-id"
    GCP_BILLING_DATASET: "billing_export"
    AWS_REGION: "us-east-1"
    CORS_ORIGINS: "https://cost-optimizer.example.com"

  # Secrets - override via --set or external secret manager
  secrets:
    OPENAI_API_KEY: "CHANGEME"
    SUPABASE_URL: "CHANGEME"
    SUPABASE_KEY: "CHANGEME"
    AWS_ACCESS_KEY_ID: "CHANGEME"
    AWS_SECRET_ACCESS_KEY: "CHANGEME"

  # Use external secret (e.g., External Secrets Operator)
  externalSecret:
    enabled: false
    name: ""

  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    startup:
      path: /api/health
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 12

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Frontend configuration
frontend:
  replicaCount: 2

  image:
    repository: ghcr.io/your-org/cost-optimizer-frontend
    tag: "latest"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: cost-optimizer.example.com
  tls:
    enabled: true
    secretName: cost-optimizer-tls

# CronJob for daily cost sync
cronjob:
  enabled: true
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 3
  activeDeadlineSeconds: 600
  image:
    repository: curlimages/curl
    tag: "8.5.0"
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Network policies
networkPolicy:
  enabled: true

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

imagePullSecrets: []
